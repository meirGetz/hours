<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>דיווח שעות</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f8a5b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f3ef; --card:#fff; --ink:#1d2330; --mute:#7a8090; --line:#e6e4dd;
  --in:#1f8a5b; --in-soft:#e3f3ea; --out:#d0493f; --out-soft:#fbe7e5;
  --accent:#2f5bd3; --accent-soft:#e7edfc; --gold:#a2741a; --gold-soft:#fbf3e1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,sans-serif}
body{padding:14px 14px 40px;max-width:560px;margin:0 auto}
button{font-family:inherit;cursor:pointer}
.ltr{direction:ltr;unicode-bidi:isolate}
header{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 12px;gap:8px}
header h1{font-size:20px;margin:0;font-weight:800}
.hright{display:flex;align-items:center;gap:8px}
#sync{font-size:12px;color:var(--mute)}
.gear{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04);border:1px solid var(--line);margin-bottom:14px}
.hero{text-align:center;padding:20px 16px}
.today-date{color:var(--mute);font-size:14px}
.status{font-size:15px;margin:4px 0 16px;min-height:22px}
#mainBtn{width:190px;height:190px;border-radius:50%;border:none;color:#fff;font-size:30px;font-weight:800;
  box-shadow:0 10px 30px -8px rgba(0,0,0,.35);transition:transform .1s,background .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto;gap:2px}
#mainBtn:active{transform:scale(.96)}
#mainBtn.in{background:var(--in)} #mainBtn.out{background:var(--out)}
#mainBtn small{font-size:14px;font-weight:500;opacity:.9}
.elapsed{font-size:34px;font-weight:800;margin-top:14px;letter-spacing:.5px}
.today-sum{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{background:var(--bg);border-radius:999px;padding:5px 11px;font-size:13px}
.row-btns{display:flex;gap:8px;margin-top:16px}
.row-btns button{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 10px;font-size:15px;font-weight:500;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.green{background:#25a35a;border-color:#25a35a;color:#fff;text-decoration:none;text-align:center;display:block}
.btn.danger{color:var(--out);border-color:#f0c9c5}
.btn.danger.armed{background:var(--out);color:#fff}
.btn:disabled{opacity:.45}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mhead h2{margin:0;font-size:18px}
.nav{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--bg);border-radius:12px;padding:9px 6px;text-align:center}
.stat .v{font-size:19px;font-weight:800}
.stat .k{font-size:12px;color:var(--mute)}
.abs-line{font-size:13px;color:var(--mute);text-align:center;margin-bottom:10px;line-height:1.7}
.leave{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.lv{border:1px solid var(--line);border-radius:12px;padding:9px 10px;font-size:13px;line-height:1.55}
.lv .big{font-size:20px;font-weight:800}
.lv .sub{color:var(--mute);font-size:12px}
.money{background:var(--gold-soft);color:var(--gold);border-radius:12px;padding:9px 12px;font-size:14px;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.money b{font-size:17px}
.setlink{display:block;width:100%;text-align:center;background:none;border:1px dashed var(--line);border-radius:12px;padding:9px;color:var(--mute);font-size:13px;margin-bottom:10px}
.two{display:flex;gap:8px;margin-bottom:10px}
.two .btn{flex:1}
.day{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer}
.day:active{background:var(--bg)}
.day .d{width:54px;flex-shrink:0;font-weight:700;font-size:14px}
.day .d small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.day .mid{flex:1;font-size:13px;line-height:1.5;min-width:0}
.day .tot{font-weight:800;font-size:15px;text-align:left}
.day .tot small{display:block;font-weight:500;font-size:11px}
.day.empty{opacity:.45}
.day.empty .tot{font-weight:400}
.day.wkend .d{color:var(--mute)}
.pos{color:var(--in)} .neg{color:var(--out)}
.chip{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;margin-inline-end:4px;background:var(--accent-soft);color:var(--accent)}
.chip.sick{background:#fdeee0;color:#b45a12}.chip.child{background:#f3e8fb;color:#7b3fb0}
.chip.vac{background:#e2f4f6;color:#16737f}.chip.course{background:#eef0d9;color:#66701a}
.chip.parent{background:#fbe9f0;color:#a0365f}.chip.holiday{background:#fff3d6;color:#8a5a00}
.open{color:var(--in);font-weight:700}
.note{color:var(--mute);font-size:12px}
.overlay{position:fixed;inset:0;background:rgba(20,24,33,.45);display:none;align-items:flex-end;justify-content:center;z-index:27}
.overlay.show{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px 22px;max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 12px;font-size:18px}
.sheet h4{margin:18px 0 4px;font-size:15px}
.lbl{font-size:13px;color:var(--mute);margin:14px 0 6px}
.hint{font-size:12px;color:var(--mute);line-height:1.5}
.sess{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.sess input{flex:1;font-size:17px;padding:9px 6px;border:1px solid var(--line);border-radius:10px;font-family:inherit;background:#fff;min-width:0;text-align:center}
.sess .x{border:none;background:var(--out-soft);color:var(--out);width:38px;height:40px;border-radius:10px;font-size:16px;flex-shrink:0}
.sess .dash{color:var(--mute)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:14px}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;font-family:inherit;font-size:15px;resize:vertical;min-height:44px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.fld input{width:100%;font-size:16px;padding:9px 8px;border:1px solid var(--line);border-radius:10px;font-family:inherit;background:#fff;min-width:0}
.preview{margin-top:14px;background:var(--bg);border-radius:12px;padding:10px;text-align:center;font-size:15px}
.actions{display:flex;gap:8px;margin-top:16px}
.actions .btn{flex:1}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0}
.chk input{width:18px;height:18px}
pre.export{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:12px;font-family:inherit;font-size:13px;max-height:40vh;overflow:auto;margin:10px 0 0}
.admin{position:fixed;inset:0;background:var(--bg);z-index:25;overflow:auto;display:none;padding:14px}
.admin.show{display:block}
.admin .inner{max-width:900px;margin:0 auto}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters select,.filters input{width:100%;font-size:15px;padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff;font-family:inherit;min-width:0}
.emp{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
.emp.all{background:var(--accent-soft);border-color:#c9d6f7}
.emp .top{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:15px}
.emp .meta{font-size:13px;color:var(--mute);line-height:1.7}
.arow{display:flex;gap:10px;padding:9px 4px;border-top:1px solid var(--line);font-size:13px;align-items:center}
.arow .who{width:86px;flex-shrink:0;font-weight:700;line-height:1.4}
.arow .who small{display:block;font-weight:400;color:var(--mute)}
.arow .mid{flex:1;min-width:0;line-height:1.5}
.arow .tot{font-weight:800;text-align:left}
.arow .tot small{display:block;font-weight:500;font-size:11px}
.login{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:30;padding:24px;text-align:center}
.login.show{display:flex}
.lbox{max-width:360px}
.lbox h2{margin:6px 0 8px;font-size:24px}
.lbox p{color:var(--mute);line-height:1.6;margin:0 0 20px}
.lbox .btn{width:100%;padding:14px;font-size:17px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <h1>⏱️ דיווח שעות</h1>
  <div class="hright"><span id="sync"></span><button class="gear" id="bizBtn" style="display:none;width:auto;padding:0 10px;font-size:14px;font-family:inherit"></button><button class="gear" id="ownerBtn" aria-label="ניהול עסקים" style="display:none">🏛️</button><button class="gear" id="adminBtn" aria-label="ניהול" style="display:none">👑</button><button class="gear" id="gear" aria-label="הגדרות">⚙️</button></div>

<section class="card hero">

  <header><div><h1>👑 ניהול</h1><div class="note" id="aRole"></div></div><div class="hright"><button class="gear" id="aRefresh" aria-label="רענון">🔄</button><button class="gear" id="aClose" aria-label="סגירה">✕</button></div></header>
  <section class="card">

<script type="module">
import { firebaseConfig } from './config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, setDoc, getDoc, getDocs, deleteDoc, updateDoc, collection, onSnapshot, terminate, clearIndexedDbPersistence, Timestamp, query, where, limit, writeBatch, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* ---------- constants & helpers ---------- */
const ABS = {
  sick:   {l:'מחלה',     e:'🤒'},
  child:  {l:'מחלת ילד', e:'👶'},
  parent: {l:'מחלת הורה', e:'👵'},
  vac:    {l:'חופש',     e:'🏖️'},
  course: {l:'קורס',     e:'📚'},
  holiday:{l:'חג',       e:'🕯️'}
};
const DOW = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const dateKey = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const monthOf = dk => dk.slice(0,7);
const parseDK = dk => { const [y,m,d] = dk.split('-').map(Number); return new Date(y,m-1,d); };
const hhmm = d => pad(d.getHours())+':'+pad(d.getMinutes());
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const normT = t => { const [h,m] = t.split(':'); return pad(+h)+':'+pad(+m); };
function fmt(m, sign){
  m = Math.round(m);
  const s = m < 0 ? '-' : (sign && m > 0 ? '+' : '');
  m = Math.abs(m);
  return s + Math.floor(m/60) + ':' + pad(m%60);
}
const fmtD = n => String(Math.round(n*100)/100);
const fmtH = h => String(Math.round(h*100)/100);
const money = n => '₪' + Math.round(n).toLocaleString('he-IL');
const num = v => { if(v===''||v==null) return null; const n = parseFloat(String(v).replace(',','.')); return isFinite(n) ? n : null; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------- data ----------
   months['YYYY-MM'] = { days: { 'YYYY-MM-DD': { s:[{i,o}], a:{t,p}|null, n } } }
   settings = { std, thu, wage, leave:{ vac:{bal,from,acc}, sick:{bal,from,acc} } }
*/
const DEFAULT_SETTINGS = () => ({std:9, thu:8.5, wage:null, leave:{vac:{bal:null,from:'',acc:null}, sick:{bal:null,from:'',acc:null}}});
let months = {};
let settings = DEFAULT_SETTINGS();
let viewMonth = monthOf(dateKey(new Date()));

function cleanLeave(L){ L = L || {}; return {bal: num(L.bal), from: DK_RE.test(L.from) ? L.from : '', acc: num(L.acc)}; }
let myLeave = null;
function leaveFromDoc(d){ return {vac: cleanLeave(d && d.vac), sick: cleanLeave(d && d.sick)}; }
function withLeave(st, d){ st.leave = leaveFromDoc(d); return st; }
function fixSettings(s){
  const d = DEFAULT_SETTINGS();
  s = s || {};
  return {
    std: num(s.std) ?? d.std, thu: num(s.thu) ?? d.thu, wage: null,   // שכר לא נשמר בשום מקום
    leave: {
      vac:  cleanLeave(null),   // היתרות מגיעות רק ממה שהמנהל הגדיר (users/<id>/admin/leave)
      sick: cleanLeave(null)
    },
    nsUser: (n => ({name: str(n.name), customer: str(n.customer), task: str(n.task)}))(s.nsUser || {})
  };
}

/* ניקוי נתונים שמגיעים מהענן – מגן מפני קוד זדוני (XSS) ונתונים לא תקינים */
const T_RE = /^\d{2}:\d{2}$/, DK_RE = /^\d{4}-\d{2}-\d{2}$/;
const str = (v, max) => typeof v === 'string' ? v.slice(0, max || 200) : '';
function cleanMonth(m){
  const out = {days:{}};
  const days = m && typeof m.days === 'object' && m.days || {};
  for(const dk of Object.keys(days)){
    if(!DK_RE.test(dk)) continue;
    const d = days[dk] || {};
    const s = (Array.isArray(d.s) ? d.s : []).slice(0, 30).filter(x => x && T_RE.test(x.i)).map(x => {
      const o = {i:x.i, o: T_RE.test(x.o) ? x.o : null};
      if(x.c || x.t){ o.c = str(x.c); o.t = str(x.t); }
      return o;
    });
    const a = d.a && ABS[d.a.t] ? {t:d.a.t, p: d.a.p === 0.5 ? 0.5 : 1} : null;
    out.days[dk] = {s, a, n: str(d.n, 500)};
    if(d.f === true) out.days[dk].f = true;
    if(d.r === true) out.days[dk].r = true;   // עבודה במהלך מילואים
    if(d.e === true) out.days[dk].e = true;   // תוקן בדיעבד
  }
  return out;
}
function cleanMonths(ms){ const out = {}; for(const k of Object.keys(ms || {})) if(/^\d{4}-\d{2}$/.test(k)) out[k] = cleanMonth(ms[k]); return out; }

/* תקן יומי (בדקות) לחישוב יתרה; ימי שישי-שבת: 0 – כל השעות נספרות כתוספת */
function stdFor(dk){ const w = parseDK(dk).getDay(); if(w===4) return settings.thu*60; if(w>=5) return 0; return settings.std*60; }
/* שווי יום היעדרות מלא (בדקות) */
function absDayMin(dk){ return parseDK(dk).getDay()===4 ? settings.thu*60 : settings.std*60; }

function getDay(dk){ const m = months[monthOf(dk)]; return m && m.days && m.days[dk] || null; }
/* כל שינוי ביום נשמר יחד עם רשומה ביומן השינויים, באותה פעולה (הכללים ב-Firebase דורשים את זה) */
const LATE_MS = 36 * 3600 * 1000;
function isLateDay(dk){ return parseDK(dk).getTime() < Date.now() - LATE_MS; }
function setDay(dk, day, action){
  const mk = monthOf(dk);
  if(!months[mk]) months[mk] = {days:{}};
  if(!months[mk].days) months[mk].days = {};
  const before = months[mk].days[dk] ? JSON.parse(JSON.stringify(months[mk].days[dk])) : null;
  const empty = !day || ((!day.s || !day.s.length) && !day.a && !(day.n||'').trim() && !day.f);
  // מנרמלים בדיוק כמו בקריאה מהענן, כדי שהיומן ("לפני"/"אחרי") יתאים אחד-לאחד למה שנשמר
  let after = empty ? null : cleanMonth({days: {[dk]: JSON.parse(JSON.stringify(day))}}).days[dk];
  // עריכה של יום שעבר (או של יום שכבר תוקן בדיעבד) מסומנת לתמיד
  if(after && (isLateDay(dk) || (before && before.e))) after.e = true;
  if(JSON.stringify(before) === JSON.stringify(after)) return;
  if(after) months[mk].days[dk] = after; else delete months[mk].days[dk];
  saveLocal();
  if(!fdb || !uid || !bid) return;
  const aRef = doc(collection(fdb, ...BP(), 'users', uid, 'audit'));
  const batch = writeBatch(fdb);
  batch.set(aRef, {at: serverTimestamp(), by: uid, dk, action: str(action || 'edit', 20), before, after});
  batch.set(doc(fdb, ...BP(), 'users', uid, 'data', 'm-' + mk), {days: JSON.parse(JSON.stringify(months[mk].days)), lastAudit: aRef.id});
  batch.commit().catch(e => setSync('⚠️ השינוי לא נשמר (' + (e.code || '') + ') – רענן ונסה שוב'));
}
function sessMin(s, dk){
  if(!s.i) return 0;
  let end;
  if(s.o) end = toMin(s.o);
  else {
    const now = new Date(), today = dateKey(now);
    if(dk > today) return 0;
    const days = Math.round((parseDK(today)-parseDK(dk))/864e5);
    return Math.max(0, days*1440 + now.getHours()*60 + now.getMinutes() - toMin(s.i));
  }
  let d = end - toMin(s.i);
  if(d < 0) d += 1440;
  return d;
}
function workMin(day, dk){ return (day && day.s || []).reduce((a,s)=>a+sessMin(s,dk),0); }
function absMin(day, dk){ return day && day.a ? absDayMin(dk) * (day.a.p||1) : 0; }
function totalMin(day, dk){ return workMin(day,dk) + absMin(day,dk); }

function findOpen(){
  for(const mk of Object.keys(months).sort().reverse()){
    const days = months[mk].days || {};
    for(const dk of Object.keys(days).sort().reverse()){
      const s = days[dk].s || [];
      for(let i=s.length-1;i>=0;i--) if(!s[i].o) return {dk, idx:i};
    }
  }
  return null;
}

/* ---------- leave balances ---------- */
const LEAVE_TYPES = { vac:['vac'], sick:['sick','child','parent'] }; // מחלת ילד ומחלת הורה נספרות כימי מחלה
function usedBetween(kind, fromDK, toDK){
  let u = 0;
  for(const mk in months){
    const days = months[mk].days || {};
    for(const dk in days){
      if(dk < fromDK || dk > toDK) continue;
      const a = days[dk].a;
      if(a && LEAVE_TYPES[kind].includes(a.t)) u += a.p || 1;
    }
  }
  return u;
}
/* ספירת ימי חופש ומחלה שנוצלו (בלי יתרות – אף אחד לא מזין יתרה) */
function usedCount(kind, fromDK, toDK){ return usedBetween(kind, fromDK, toDK); }
function usageHtml(mk){
  const y = mk.slice(0,4), last = mk + '-31';
  const box = (k, t) => `<div class="lv">${t}<div class="big">${fmtD(usedCount(k, mk + '-01', last))} <span style="font-size:13px;font-weight:500">ימים החודש</span></div>
    <div class="sub">מתחילת ${y}: ${fmtD(usedCount(k, y + '-01-01', last))} ימים</div></div>`;
  return `<div class="leave">${box('vac','🏖️ חופש')}${box('sick','🤒 מחלה (כולל ילד והורה)')}</div>`;
}
function leaveAt(kind, untilDK){
  const L = settings.leave[kind];
  if(L.bal == null || !L.from) return null;
  const [fy,fm] = L.from.split('-').map(Number), [uy,um] = untilDK.split('-').map(Number);
  const n = Math.max(0, (uy*12+um) - (fy*12+fm));
  const accrued = n * (L.acc || 0);
  const used = untilDK < L.from ? 0 : usedBetween(kind, L.from, untilDK);
  return {bal:L.bal, accrued, used, left: L.bal + accrued - used};
}
function leaveMonth(kind, mk){
  const L = settings.leave[kind];
  if(L.bal == null || !L.from) return null;
  const first = mk + '-01', last = mk + '-31';
  if(last < L.from) return null;
  const acc = mk > monthOf(L.from) ? (L.acc || 0) : 0;
  const used = usedBetween(kind, first < L.from ? L.from : first, last);
  return {acc, used, end: leaveAt(kind, last).left};
}

function monthStats(mk){
  const days = (months[mk] && months[mk].days) || {};
  let work=0, abs=0, worked=0, balance=0; const a = Object.fromEntries(Object.keys(ABS).map(k => [k, 0]));
  for(const dk in days){
    const d = days[dk]; const w = workMin(d,dk), ab = absMin(d,dk);
    work += w; abs += ab;
    if(w>0) worked++;
    if(w>0 || d.a) balance += w + ab - stdFor(dk);
    if(d.a) a[d.a.t] += d.a.p||1;
  }
  return {work, abs, total:work+abs, worked, a, balance};
}
function yearTotalMin(year, uptoMk){
  let t = 0;
  for(const mk in months) if(mk.startsWith(year+'-') && mk <= uptoMk) t += monthStats(mk).total;
  return t;
}

    const pl = s => sessProj(s) ? ` <span class="chip ltr" style="background:#eef2f6;color:#455">${esc(optLabel(sessProj(s)))}</span>` : '';
    const sess = (day.s||[]).map(s => (s.o ? `<span class="ltr">${s.i}–${s.o}</span>` : `<span class="ltr open">${s.i}–…</span>`) + pl(s)).join(' · ');
    const tot = totalMin(day,dk), diff = tot - stdFor(dk);
    html += `<div class="day${wk}" data-dk="${dk}">
      <div class="d">${DOW[dow]}<small>${pad(d)}/${pad(m)}</small></div>
      <div class="mid">${absChip(day.a)}${day.f ? '<span class="chip">📎</span>' : ''}${day.r ? '<span class="chip">🪖 מילואים</span>' : ''}${day.e ? '<span class="chip" style="background:#fff3d6;color:#8a5a00">✏️</span>' : ''}${sess}${day.n?`<div class="note">${esc(day.n)}</div>`:''}</div>
      <div class="tot ltr">${fmt(tot)}<small class="${diff<0?'neg':'pos'}">${fmt(diff,true)}</small></div></div>`;
  }
  if(!html) html = '<div class="note" style="text-align:center;padding:14px">אין עדיין ימים בחודש הזה</div>';
  $('days').innerHTML = html;
}

/* ---------- אישורי מחלה (נשמרים מכווצים במסד הנתונים, אחד לכל יום) ---------- */
const NOTE_TYPES = ['sick','child','parent'];
const MAX_B64 = 900000;
const toB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
async function fileToPayload(file){
  if(file.type === 'application/pdf'){
    const data = await toB64(file);
    if(data.length > MAX_B64) throw new Error('הקובץ גדול מדי – PDF עד כ-650KB. אפשר לצלם את האישור במקום.');
    return {name: str(file.name, 120), type: 'application/pdf', data};
  }
  if(!/^image\//.test(file.type)) throw new Error('אפשר לצרף רק תמונה או PDF');
  let img;
  try{ img = await createImageBitmap(file, {imageOrientation:'from-image'}); }catch(e){ img = await createImageBitmap(file); }
  let side = 1600, q = 0.75;
  for(let i = 0; i < 7; i++){
    const sc = Math.min(1, side / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
    const data = await toB64(blob);
    if(data.length <= MAX_B64) return {name: str(file.name.replace(/\.[^.]+$/, ''), 110) + '.jpg', type: 'image/jpeg', data};
    side *= 0.8; q = Math.max(0.45, q - 0.07);
  }
  throw new Error('לא הצלחתי לכווץ את התמונה מספיק');
}
async function openAttachment(ownerUid, dk){
  try{
    const snap = await getDoc(doc(fdb, ...BP(), 'users', ownerUid, 'files', dk));
    if(!snap.exists()){ toast('האישור לא נמצא'); return; }
    const f = snap.data();
    const bin = atob(f.data), arr = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const file = new File([arr], f.name || ('אישור-' + dk), {type: f.type});
    const url = URL.createObjectURL(file);
    const w = window.open(url, '_blank');
    if(!w) downloadFile(file);
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }catch(e){ toast('שגיאה בפתיחת האישור (' + (e.code || e.message) + ')'); }
}
async function removeAttachment(dk){
  try{ await deleteDoc(doc(fdb, ...BP(), 'users', uid, 'files', dk)); }catch(e){}

}

    h += `<div class="lbl">היעדרות</div><div class="seg" id="absSeg">

      h += `<div class="lbl">📎 אישור מחלה (אחד ליום)</div>`;
      if(!saved) h += `<div class="hint">שמור קודם את יום המחלה, ואז אפשר יהיה לצרף אישור.</div>`;
      else if(src.f) h += `<div class="two" style="margin-bottom:0"><button class="btn" id="attView">👁️ צפייה</button><button class="btn" id="attRep">🔄 החלפה</button><button class="btn danger" id="attDel">🗑️</button></div>`;

        }catch(err){ $('attMsg').textContent = '⚠️ ' + (err.message || err.code || 'ההעלאה נכשלה'); }
      };
    }
    $('cancel').onclick = closeSheet;
    $('save').onclick = () => {
      draft.s = draft.s.filter(s => s.i).map(s => { const o = {i:s.i, o:s.o||null}; if(s.c || s.t){ o.c = s.c || ''; o.t = s.t || ''; } return o; });
      draft.s.sort((a,b) => a.i.localeCompare(b.i));

      if(draft.f && !(draft.a && NOTE_TYPES.includes(draft.a.t))){ delete draft.f; deleteDoc(doc(fdb, ...BP(), 'users', uid, 'files', dk)).catch(()=>{}); }
      setDay(dk, draft, src ? 'edit' : 'add'); closeSheet(); render(); toast('נשמר ✔︎');

    if($('clear')) $('clear').onclick = () => {
      if(!armed){ armed = true; draw(); return; }

      setDay(dk, null, 'delete'); closeSheet(); render(); toast('היום נמחק');
    };
    if(focusAbs){ focusAbs = false; setTimeout(()=> $('absSeg').scrollIntoView({block:'center'}), 50); }
  }
  function updPrev(){
    const valid = {s: draft.s.filter(s=>s.i), a: draft.a};

function monthText(mk, opt){
  const [y,m] = mk.split('-').map(Number);
  const days = (months[mk] && months[mk].days) || {};
  const st = monthStats(mk);
  const L = [];
  L.push(`📋 *דיווח שעות – ${MONTHS[m-1]} ${y}*`);
  L.push('━━━━━━━━━━━━');
  Object.keys(days).sort().forEach(dk => {
    const d = days[dk];
    const bits = [];
    const sess = (d.s||[]).map(s => `${s.i}–${s.o||'…'}`).join(', ');
    if(sess) bits.push(`${sess} (${fmt(workMin(d,dk))})${d.r ? ' 🪖 מילואים' : ''}`);
    if(d.a) bits.push(`${ABS[d.a.t].e} ${d.a.p===0.5?'חצי יום ':''}${ABS[d.a.t].l} (${fmt(absMin(d,dk))})`);
    let line = `${dayLabel(dk)}: ` + bits.join(' + ');
    if(sess && d.a) line += ` = ${fmt(totalMin(d,dk))}`;
    if(d.n) line += ` – ${d.n.replace(/\s+/g,' ')}`;
    L.push(line);
  });
  L.push('━━━━━━━━━━━━');
  L.push(`*סה״כ שעות: ${fmt(st.total)}*`);
  L.push(`עבודה בפועל: ${fmt(st.work)} | ימי עבודה: ${st.worked}`);
  const parts = Object.keys(ABS).filter(k=>st.a[k]).map(k=>`${ABS[k].l}: ${fmtD(st.a[k])}`);
  if(parts.length) L.push('היעדרויות – ' + parts.join(' | '));
  L.push(`מול התקן: ${fmt(st.balance,true)}`);
  if(opt.leave){
    L.push(`🏖️ חופש: ${fmtD(usedCount('vac', mk + '-01', mk + '-31'))} ימים החודש, ${fmtD(usedCount('vac', y + '-01-01', mk + '-31'))} מתחילת השנה`);
    L.push(`🤒 מחלה: ${fmtD(usedCount('sick', mk + '-01', mk + '-31'))} ימים החודש, ${fmtD(usedCount('sick', y + '-01-01', mk + '-31'))} מתחילת השנה`);
  }
  if(opt.money && settings.wage) L.push(`💰 שכר משוער: ${money(st.total/60*settings.wage)}`);
  return L.join('\n');
}
function settingsLine(){
  const s = settings, lv = k => { const L = s.leave[k]; return L.bal==null ? '' : `${L.bal},${L.from},${L.acc ?? 0}`; };
  return `⚙️ הגדרות: תקן=${s.std}; חמישי=${s.thu}`;
}

  const build = () => isFull
    ? Object.keys(months).filter(k => Object.keys(months[k].days||{}).length).sort().map(k => monthText(k, {leave:false, money:false})).join('\n\n') + '\n\n' + settingsLine()

  sheet.innerHTML = `<h3>${title}</h3>
    ${isFull ? '<div class="hint">שלח את ההודעה הזו לעצמך. כדי לשחזר: הדבק אותה במסך "שחזור מהודעה".</div>' : `

    ${settings.wage ? '<label class="chk"><input type="checkbox" id="oMoney"> כולל שכר משוער</label>' : ''}`}
    <pre class="export" id="expTxt"></pre>
    <div class="actions" style="flex-direction:column">
      <a class="btn green" id="waLink" target="_blank" rel="noopener">💬 שליחה בוואטסאפ</a>
      <button class="btn" id="copyBtn">📋 העתקת הטקסט</button>
      <button class="btn" id="closeExp">סגירה</button>
    </div>`;
  let txt = '';
  const upd = () => { txt = build(); $('expTxt').textContent = txt; $('waLink').href = 'https://wa.me/?text=' + encodeURIComponent(txt); };
  if($('oLeave')) $('oLeave').onchange = e => { opt.leave = e.target.checked; upd(); };
  if($('oMoney')) $('oMoney').onchange = e => { opt.money = e.target.checked; upd(); };
  upd();

/* ---------- restore from message ---------- */
function parseMessage(text){
  const out = {months:{}, settings:null};
  let cy = null, cm = null;
  const lines = text.replace(/\r/g,'').split('\n');
  for(let raw of lines){
    const line = raw.replace(/\*/g,'').trim();
    if(!line) continue;
    const h = line.match(/דיווח שעות\s*[–—-]\s*([א-ת]+)\s+(\d{4})/);
    if(h){ const i = MONTHS.indexOf(h[1]); if(i>=0){ cm = i+1; cy = +h[2]; } continue; }
    if(line.startsWith('⚙️') || line.startsWith('⚙')){ out.settings = parseSettingsLine(line); continue; }
    const dm = line.match(/^\S+\s+(\d{1,2})\/(\d{1,2})\s*:\s*(.*)$/);
    if(!dm || cy == null) continue;
    const dd = +dm[1], mm = +dm[2];
    let yy = cy;
    if(cm === 12 && mm === 1) yy = cy + 1;
    if(cm === 1 && mm === 12) yy = cy - 1;
    const dk = `${yy}-${pad(mm)}-${pad(dd)}`;
    let rest = dm[3], note = '';
    const ni = rest.indexOf(' – ');
    if(ni >= 0){ note = rest.slice(ni+3).trim(); rest = rest.slice(0, ni); }
    const day = {s:[], a:null, n:note};
    const re = /(\d{1,2}:\d{2})\s*[–—-]\s*(\d{1,2}:\d{2}|…|\.\.\.)/g; let mt;
    while((mt = re.exec(rest))) day.s.push({i: normT(mt[1]), o: /\d/.test(mt[2]) ? normT(mt[2]) : null});
    let t = null;
    if(rest.includes('מחלת ילד')) t = 'child';
    else if(rest.includes('מחלת הורה')) t = 'parent';
    else if(rest.includes('מחלה')) t = 'sick';
    else if(rest.includes('חופש')) t = 'vac';
    else if(rest.includes('קורס')) t = 'course';
    else if(/(^|[^א-ת])חג([^א-ת]|$)/.test(rest)) t = 'holiday';
    if(t) day.a = {t, p: rest.includes('חצי') ? 0.5 : 1};
    if(day.s.length && /🪖|מילואים/.test(rest)) day.r = true;
    if(!day.s.length && !day.a && !day.n) continue;
    const mk = monthOf(dk);
    (out.months[mk] = out.months[mk] || {days:{}}).days[dk] = day;
  }
  return out;
}
function parseSettingsLine(line){
  const body = line.split(':').slice(1).join(':');
  const kv = {};
  body.split(';').forEach(p => { const i = p.indexOf('='); if(i>0) kv[p.slice(0,i).trim()] = p.slice(i+1).trim(); });
  const lv = v => { if(!v) return {bal:null, from:'', acc:null}; const [b,f,a] = v.split(','); return {bal:num(b), from:(f||'').trim(), acc:num(a)}; };
  return fixSettings({ std: num(kv['תקן']), thu: num(kv['חמישי']), wage: num(kv['שכר']), leave:{ vac: lv(kv['חופש']), sick: lv(kv['מחלה']) } });
}

function dayMatch(type, dk, d){
  const w = workMin(d, dk), tot = w + absMin(d, dk);
  switch(type){
    case 'work': return w > 0;
    case 'abs': return !!d.a;
    case 'sick': case 'child': case 'parent': case 'vac': case 'course': case 'holiday': return !!(d.a && d.a.t === type);
    case 'short': return (w > 0 || d.a) && tot < stdFor(dk);
    case 'open': return (d.s || []).some(s => !s.o);
    case 'late': return d.e === true;
    default: return true;
  }
}
function userRows(u, from, to, type){

    for(const mk in u.months){
      const days = u.months[mk].days || {};
      for(const dk in days){
        if(dk < from || dk > to) continue;
        const d = days[dk];
        if(!dayMatch(type || 'all', dk, d)) continue;
        const w = workMin(d, dk), ab = absMin(d, dk);
        rows.push({u, dk, d, w, ab, tot: w + ab, std: stdFor(dk)});

  });

}

function nsEmp(u){

function nsCsv(rows){
  const {out, issues} = nsBuild(rows);
  const head = ['External ID','Employee','Date','Duration','Customer','Case/Task/Event','Service Item','Memo','Work At Reserve Duty','Type'];
  const csv = [head.map(csvQ).join(',')].concat(out.map(o => [o.ext, o.emp, o.date, o.hours, o.customer, o.task, '', o.memo, o.resv ? 'T' : 'F', 'Actual Time'].map(csvQ).join(','))).join('\r\n');
  const warn = [];
  if(issues.emp.size) warn.push(`⚠️ חסר שם ב-NetSuite ל: ${[...issues.emp].join(', ')}`);
  if(issues.map) warn.push(`⚠️ ${issues.map} שורות בלי Customer או Task (למשל קורס)`);
  if(issues.open) warn.push(`⚠️ ${issues.open} ימים עם כניסה בלי יציאה – השעות הפתוחות לא נכללו`);

}

function nsBuild(rowsIn){

  rowsIn.slice().sort((a,b) => a.dk.localeCompare(b.dk) || a.u.name.localeCompare(b.u.name, 'he')).forEach(r => {
    const e = nsEmp(r.u);
    if(!e.nsName) issues.emp.add(r.u.name);
    const d = parseDK(r.dk), date = `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
    const emp = e.nsName || r.u.name;
    const sess = (r.d.s || []).filter(s => s.o).map(s => `${s.i}-${s.o}`).join(', ');
    if((r.d.s || []).some(s => !s.o)) issues.open++;
    const push = (kind, c, t, m, memo) => {
      if(!c || !t) issues.map++;
      out.push({ext:`HRS-${r.u.uid.slice(0,8)}-${r.dk}-${kind}`, emp, date, hours:(m/60).toFixed(2), customer:c, task:t, memo, resv: kind[0] === 'W' && r.d.r === true});
    };
    const groups = {};
    (r.d.s || []).filter(s => s.o).forEach(s => {
      const p = sessProj(s) || e, k = optKey(p);
      const g = groups[k] = groups[k] || {c:p.customer, t:p.task, m:0, sess:[]};
      g.m += sessMin(s, r.dk); g.sess.push(`${s.i}-${s.o}`);
    });
    Object.values(groups).forEach((g, i) => {
      if(g.m <= 0) return;
      const kind = optKey({customer:g.c, task:g.t}) === optKey(e) ? 'W' : 'W' + hashStr(optKey({customer:g.c, task:g.t}));
      push(kind, g.c, g.t, g.m, [g.sess.join(', '), r.d.n].filter(Boolean).join(' | '));
    });

      const mp = nsCfg.map[r.d.a.t];
      push('A', mp.customer, mp.task, r.ab, (r.d.a.p === 0.5 ? 'חצי יום ' : '') + ABS[r.d.a.t].l + (r.d.f ? ' (אישור מצורף)' : ''));
    }
  });

}

/* ---------- מחשבון שכר: שום נתון לא נשמר (לא בענן, לא במכשיר) ---------- */
// מיקום כל יום מחלה בתוך תקופת מחלה רצופה (שישי-שבת לא קוטעים את הרצף)
function sickPositions(){
  const days = [];
  for(const mk in months){ const ds = months[mk].days || {}; for(const dk in ds){ const a = ds[dk].a; if(a && NOTE_TYPES.includes(a.t)) days.push(dk); } }
  days.sort();
  const pos = {}; let prev = null, n = 0;
  const prevWorkday = dk => { const d = parseDK(dk); do{ d.setDate(d.getDate() - 1); }while(d.getDay() >= 5); return dateKey(d); };
  days.forEach(dk => { n = (prev && prev === prevWorkday(dk)) ? n + 1 : 1; pos[dk] = n; prev = dk; });
  return pos;
}
const sickFactor = p => p <= 1 ? 0 : p <= 3 ? 0.5 : 1;   // חוק דמי מחלה: יום 1 – 0%, ימים 2-3 – 50%, מיום 4 – 100%
function payBreakdown(from, to, sickMode){
  // לכל יום: עד התקן = 100%, שעתיים ראשונות מעל התקן = 125%, מעבר לזה = 150%; שישי-שבת = 150%
  const r = {reg:0, ot125:0, ot150:0, weekend:0, abs:0, days:0, sick100:0, sick50:0, sick0:0};
  const pos = sickMode === 'law' ? sickPositions() : null;
  for(const mk in months){
    const days = months[mk].days || {};
    for(const dk in days){
      if(dk < from || dk > to) continue;
      const d = days[dk], w = workMin(d, dk), ab = absMin(d, dk);
      if(!w && !ab) continue;
      r.days++; r.abs += ab;
      const sickMin = d.a && NOTE_TYPES.includes(d.a.t) ? ab : 0;
      if(sickMin){
        const f = pos ? sickFactor(pos[dk]) : 1;
        if(f === 1) r.sick100 += sickMin; else if(f === 0.5) r.sick50 += sickMin; else r.sick0 += sickMin;
      }
      if(parseDK(dk).getDay() >= 5){ r.weekend += w; r.reg += ab - sickMin; continue; }
      const tot = w + ab, std = stdFor(dk);
      const ot = Math.max(0, tot - std);
      r.reg += Math.max(0, tot - ot - sickMin);
      r.ot125 += Math.min(ot, 120);
      r.ot150 += Math.max(0, ot - 120);
    }
  }
  return r;
}
function openCalc(){
  const [y,m] = viewMonth.split('-').map(Number);
  let rate = null, sickMode = 'law', from = viewMonth + '-01', to = viewMonth + '-' + pad(new Date(y, m, 0).getDate());
  function result(){
    const b = payBreakdown(from, to, sickMode), h = x => x / 60;
    const rows = [
      ['שעות רגילות (100%)', b.reg, 1],
      ['שעות נוספות 125%', b.ot125, 1.25],
      ['שעות נוספות 150%', b.ot150, 1.5],
      ['שישי-שבת 150%', b.weekend, 1.5],
      ['🤒 ימי מחלה 100%', b.sick100, 1],
      ['🤒 ימי מחלה 50% (ימים 2–3)', b.sick50, 0.5],
      ['🤒 יום מחלה ראשון (לא משולם)', b.sick0, 0]
    ];
    let total = 0;
    const tr = rows.filter(x => x[1] > 0).map(([l, mins, f]) => {
      const amt = rate != null ? h(mins) * rate * f : null; if(amt) total += amt;
      return `<tr><td style="text-align:right">${l}</td><td class="ltr">${fmt(mins)}</td><td class="ltr">${rate != null ? money(amt) : '–'}</td></tr>`;
    }).join('');
    return `<div class="nswrap" style="direction:rtl"><table class="ns" style="direction:rtl;min-width:0">
      <tr><th style="text-align:right">סוג</th><th>שעות</th><th>סכום</th></tr>${tr || '<tr><td colspan="3">אין דיווחים בטווח</td></tr>'}
      <tr class="tot"><td style="text-align:right">סה״כ ברוטו משוער</td><td class="ltr">${fmt(b.reg + b.ot125 + b.ot150 + b.weekend + b.sick100 + b.sick50 + b.sick0)}</td><td class="ltr">${rate != null ? money(total) : '–'}</td></tr></table></div>
      ${b.abs - b.sick100 - b.sick50 - b.sick0 > 0 ? `<div class="hint" style="margin-top:6px">השעות הרגילות כוללות <span class="ltr">${fmt(b.abs - b.sick100 - b.sick50 - b.sick0)}</span> שעות חופש/קורס.</div>` : ''}`;
  }
  function draw(){
    sheet.innerHTML = `<h3>🧮 מחשבון שכר</h3>
      <div class="hint" style="margin-bottom:10px">🔒 הסכום שתזין <b>לא נשמר בשום מקום</b> – לא בענן ולא בטלפון. כשסוגרים את החלון הוא נמחק.</div>
      <div class="fld"><label>שכר שעתי ברוטו (₪)</label><input id="calcRate" inputmode="decimal" autocomplete="off" name="r${Math.random().toString(36).slice(2)}" placeholder="הזן שכר שעתי" value="${rate ?? ''}"></div>
      <div class="grid2" style="margin-top:8px"><div class="fld"><label>מתאריך</label><input type="date" id="calcFrom" value="${from}"></div><div class="fld"><label>עד תאריך</label><input type="date" id="calcTo" value="${to}"></div></div>
      <div class="lbl">🤒 תשלום ימי מחלה (כולל מחלת ילד והורה)</div>
      <div class="seg" id="calcSick">
        <button data-m="law" class="${sickMode==='law'?'on':''}">לפי חוק</button>
        <button data-m="full" class="${sickMode==='full'?'on':''}">מלא מהיום הראשון</button></div>
      <div class="hint" style="margin-top:4px">${sickMode==='law' ? 'יום ראשון בכל תקופת מחלה רצופה – לא משולם, ימים 2–3 – 50%, מהיום הרביעי – 100%. שישי-שבת לא קוטעים את הרצף.' : 'כל יום מחלה משולם ב-100% (כשהמעסיק משלם מעבר לחוק).'}</div>
      <div id="calcOut" style="margin-top:12px">${result()}</div>
      <div class="hint" style="margin-top:10px;line-height:1.7">החישוב: עד תקן היום (9 שעות, או 8.5 בחמישי) – 100%, השעתיים הראשונות מעל התקן – 125%, ומעבר לזה – 150%. עבודה בשישי-שבת – 150%. זו הערכה לפני מסים וניכויים; היא לא כוללת נסיעות, תוספות או שעות נוספות שבועיות.</div>
      <div class="actions"><button class="btn" id="calcX">סגירה</button></div>`;
    $('calcRate').oninput = e => { rate = num(e.target.value); $('calcOut').innerHTML = result(); };
    $('calcSick').querySelectorAll('button').forEach(b => b.onclick = () => { sickMode = b.dataset.m; draw(); });
    $('calcFrom').onchange = e => { from = e.target.value || from; $('calcOut').innerHTML = result(); };
    $('calcTo').onchange = e => { to = e.target.value || to; $('calcOut').innerHTML = result(); };
    $('calcX').onclick = () => { rate = null; closeSheet(); sheet.innerHTML = ''; };
  }
  draw(); showSheet();
}

/* ---------- עסקים: רשימת העסקים שלי, הצטרפות בקוד, מעבר בין עסקים ---------- */
const CODE_ABC = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // 32 תווים, בלי O/0/I/1 שקל לבלבל
const normCode = c => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
async function sha256hex(t){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
async function loadMyBiz(u){

      return {id: b, name};
    }));
    return list.filter(x => x.id).sort((a, b) => a.name.localeCompare(b.name, 'he'));
  }catch(e){ return []; }
}

/* ---------- 🏛️ ניהול עסקים – בעל המערכת בלבד ----------
   הקוד נוצר אקראית בדפדפן, מוצג פעם אחת, ונשמר במסד הנתונים רק כטביעת אצבע (SHA-256).
   בעל המערכת לא רואה דיווחים של עסקים – רק את רשימת העסקים והקודים. */
function genCode(){
  const r = new Uint32Array(12); crypto.getRandomValues(r);          // 2^32 מתחלק ב-32 → בלי הטיה
  const c = [...r].map(x => CODE_ABC[x % 32]).join('');
  return c.slice(0, 4) + '-' + c.slice(4, 8) + '-' + c.slice(8);
}
function showCodeOnce(name, code){

    <div class="preview ltr" style="font-size:28px;font-weight:800;letter-spacing:3px">${esc(code)}</div>
    <div class="hint" style="color:var(--out);margin-top:10px;line-height:1.7"><b>הקוד מוצג פעם אחת בלבד</b> ולא נשמר בשום מקום – גם לא אצלנו. העתק ושלח אותו עכשיו לאדמין של העסק או לעובדים. אם הוא יאבד, מייצרים קוד חדש (מי שכבר הצטרף לא נפגע).</div>
    <div class="actions" style="flex-direction:column"><button class="btn primary" id="cCopy">📋 העתקת הקוד</button><button class="btn" id="cDone">סיימתי, הקוד אצלי</button></div>`;
  $('cCopy').onclick = async () => { try{ await navigator.clipboard.writeText(code); toast('הקוד הועתק ✔︎'); }catch(e){ toast('סמן והעתק ידנית'); } };
  $('cDone').onclick = () => { sheet.innerHTML = ''; openOwner(); };
  showSheet();
}
async function ownerCode(b){
  const od = await getDoc(doc(fdb, 'ownerData', b.id));
  const old = od.exists() ? od.data().codeHash : null;
  const code = genCode(), h = await sha256hex(normCode(code));
  const batch = writeBatch(fdb);
  if(old) batch.delete(doc(fdb, 'joinCodes', old));
  batch.set(doc(fdb, 'joinCodes', h), {bid: b.id, active: b.joinOpen !== false});
  batch.set(doc(fdb, 'ownerData', b.id), {codeHash: h});
  await batch.commit();
  showCodeOnce(b.name, code);
}

  sheet.querySelectorAll('[data-code]').forEach(btn => btn.onclick = async () => {
    try{ await ownerCode(list.find(b => b.id === btn.dataset.code)); }catch(e){ toast('נכשל (' + (e.code || '') + ')'); }
  });
  sheet.querySelectorAll('[data-tog]').forEach(btn => btn.onclick = async () => {
    const b = list.find(x => x.id === btn.dataset.tog);
    try{
      const od = await getDoc(doc(fdb, 'ownerData', b.id));
      const batch = writeBatch(fdb);
      batch.update(doc(fdb, 'businesses', b.id), {joinOpen: !b.joinOpen});
      if(od.exists()) batch.update(doc(fdb, 'joinCodes', od.data().codeHash), {active: !b.joinOpen});
      await batch.commit(); openOwner();
    }catch(e){ toast('נכשל (' + (e.code || '') + ')'); }
  });
  sheet.querySelectorAll('[data-adm]').forEach(btn => btn.onclick = async () => {
    const em = sheet.querySelector(`[data-adm-in="${btn.dataset.adm}"]`).value.trim().toLowerCase();
    if(!/^[^\s@\/]+@[^\s@\/]+\.[^\s@\/]+$/.test(em)){ toast('המייל לא תקין'); return; }
    try{ await setDoc(doc(fdb, 'businesses', btn.dataset.adm, 'admins', em), {role: 'admin'}); toast('האדמין נוסף ✔︎'); openOwner(); }
    catch(e){ toast('נכשל (' + (e.code || '') + ')'); }
  });
  if($('migGo')) $('migGo').onclick = async () => {
    $('migGo').disabled = true; $('migMsg').textContent = '⏳ מעביר…';
    try{ const n = await migrateLegacy($('migTo').value, m => $('migMsg').textContent = m); $('migMsg').textContent = `✅ הועברו ${n} עובדים. אפשר לעבור לעסק ולבדוק.`; }
    catch(e){ $('migMsg').textContent = '⚠️ ההעברה נעצרה (' + (e.code || e.message) + ') – אפשר להריץ שוב.'; $('migGo').disabled = false; }
  };
}
$('ownerBtn').onclick = openOwner;
$('ownerBtn2').onclick = () => { showLogin(false); openOwner(); };


/* ---------- אדמינים של העסק (אדמין העסק בלבד) ---------- */
async function openBizAdmins(){
  if(!isSuper) return;
  let list = [];
  try{ list = (await getDocs(collection(fdb, ...BP(), 'admins'))).docs.map(d => d.id).sort(); }catch(e){ toast('אין הרשאה (' + (e.code || '') + ')'); return; }
  const me = (currentUser && currentUser.email || '').toLowerCase();
  sheet.innerHTML = `<h3>👥 אדמינים של ${esc(bizName)}</h3>
    <div class="hint">אדמין רואה את כל העובדים בעסק, מאשר עובדים חדשים, מנהל את העץ ואת NetSuite. אדמין חדש צריך להצטרף עם קוד העסק; אחרי שהוא מצטרף הוא מאושר אוטומטית.</div>
    ${list.map(em => `<div class="emp" style="margin-top:8px;display:flex;justify-content:space-between;align-items:center"><span class="ltr">${esc(em)}</span>
      ${em === me ? '<span class="note">(אתה)</span>' : `<button class="btn danger" data-rm="${esc(em)}" style="padding:6px 10px">הסרה</button>`}</div>`).join('')}
    <div class="grid2" style="grid-template-columns:1fr auto;margin-top:10px"><input id="adNew" class="ltr" placeholder="מייל Google של אדמין חדש" style="font-size:15px;padding:9px;border:1px solid var(--line);border-radius:10px;font-family:inherit"><button class="btn primary" id="adAdd">הוספה</button></div>
    <div class="actions"><button class="btn" id="adX">סגירה</button></div>`;
  $('adX').onclick = closeSheet;
  $('adAdd').onclick = async () => {
    const em = $('adNew').value.trim().toLowerCase();
    if(!/^[^\s@\/]+@[^\s@\/]+\.[^\s@\/]+$/.test(em)){ toast('המייל לא תקין'); return; }
    try{ await setDoc(doc(fdb, ...BP(), 'admins', em), {role: 'admin'}); openBizAdmins(); }catch(e){ toast('נכשל (' + (e.code || '') + ')'); }
  };
  sheet.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
    try{ await deleteDoc(doc(fdb, ...BP(), 'admins', b.dataset.rm)); openBizAdmins(); }catch(e){ toast('נכשל (' + (e.code || '') + ')'); }
  });
  showSheet();
}
$('aAdmins').onclick = () => openBizAdmins();


/* ---------- 🕓 יומן שינויים: הצגת ההיסטוריה של יום ---------- */
const ACT = {import:'📥 יובא מהגרסה הקודמת', in:'כניסה', out:'יציאה', add:'הוספה', edit:'עריכה', delete:'מחיקה', attach:'צירוף אישור', detach:'הסרת אישור', project:'שינוי פרויקט', restore:'שחזור מהודעה'};
function daySummary(d){
  if(!d) return '<span class="note">— (ריק)</span>';
  const p = [];
  if(d.s && d.s.length) p.push(d.s.map(x => `<span class="ltr">${esc(x.i)}–${esc(x.o || '…')}</span>`).join(', '));
  if(d.a && ABS[d.a.t]) p.push(`${ABS[d.a.t].e} ${d.a.p === 0.5 ? 'חצי ' : ''}${ABS[d.a.t].l}`);
  if(d.r) p.push('🪖'); if(d.f) p.push('📎');
  if(d.n) p.push(`<span class="note">${esc(str(d.n, 200))}</span>`);
  return p.join(' · ') || '<span class="note">—</span>';
}
async function openHistory(ownerUid, dk, ownerName, back){
  sheet.innerHTML = `<h3>🕓 היסטוריית שינויים – ${dayLabel(dk)}</h3><div class="note" style="padding:16px;text-align:center">טוען…</div>`; showSheet();
  let items = [];
  try{
    const qs = await getDocs(query(collection(fdb, ...BP(), 'users', ownerUid, 'audit'), where('dk', '==', dk)));
    items = qs.docs.map(d => d.data()).filter(a => a && a.at).sort((a, b) => a.at.toMillis() - b.at.toMillis());
  }catch(e){ sheet.innerHTML = `<h3>🕓 היסטוריית שינויים</h3><div class="hint" style="color:var(--out)">לא ניתן לטעון (${esc(e.code || '')})</div><div class="actions"><button class="btn" id="hX">סגירה</button></div>`; $('hX').onclick = back || closeSheet; return; }
  const who = by => by === 'import' ? 'העברת נתונים' : by === ownerUid ? esc(ownerName || 'העובד') : esc((team.find(u => u.uid === by) || {}).name || 'אחר');
  sheet.innerHTML = `<h3>🕓 היסטוריית שינויים – ${dayLabel(dk)}</h3>
    <div class="hint">כל שינוי נרשם אוטומטית עם שעת השרת, ואי אפשר למחוק או לערוך את היומן – גם לא אדמין.</div>
    ${items.length ? items.map(a => {
      const t = a.at.toDate(), late = Math.floor((t - parseDK(dk)) / 864e5);
      return `<div class="emp" style="margin-top:8px"><div class="top"><span>${esc(ACT[a.action] || a.action || 'שינוי')}</span>
        <span class="note ltr">${pad(t.getDate())}/${pad(t.getMonth()+1)}/${t.getFullYear()} ${pad(t.getHours())}:${pad(t.getMinutes())}</span></div>
        <div class="meta">על ידי ${who(a.by)}${late >= 2 && a.action !== 'import' ? ` · <b style="color:var(--out)">${late} ימים אחרי היום המדווח</b>` : ''}</div>
        <div class="meta">לפני: ${daySummary(a.before)}</div><div class="meta">אחרי: ${daySummary(a.after)}</div></div>`;
    }).join('') : '<div class="note" style="padding:14px;text-align:center">אין שינויים רשומים ליום הזה.</div>'}
    <div class="actions"><button class="btn" id="hX">${back ? 'חזרה' : 'סגירה'}</button></div>`;
  $('hX').onclick = back || closeSheet;
}


/* ---------- 📦 העברה חד-פעמית מהגרסה של עסק אחד (בעל המערכת בלבד) ----------
   מעתיקה, לא מוחקת. בזמן ההעברה העסק מסומן migration=true, ורק אז הכללים מאפשרים לבעל המערכת לכתוב בו. */
async function migrateLegacy(target, progress){
  const B = ['businesses', target];
  await updateDoc(doc(fdb, 'businesses', target), {migration: true});
  try{
    const us = await getDocs(collection(fdb, 'users'));
    let n = 0;
    for(const u of us.docs){
      n++; progress && progress(`⏳ עובד ${n} מתוך ${us.size}…`);
      const p = u.data();
      await setDoc(doc(fdb, ...B, 'users', u.id), {name: str(p.name, 80), email: str(p.email, 120).toLowerCase(), lastSeen: str(p.lastSeen, 10)});
      const mref = doc(fdb, 'memberships', u.id + '_' + target);
      if(!(await getDoc(mref)).exists()) await setDoc(mref, {uid: u.id, bid: target, code: 'migrated', at: dateKey(new Date())});
      for(const d of (await getDocs(collection(fdb, 'users', u.id, 'data'))).docs){
        if(d.id === 'settings'){ const st = fixSettings(d.data()); await setDoc(doc(fdb, ...B, 'users', u.id, 'data', 'settings'), {std: st.std, thu: st.thu, nsUser: st.nsUser}); }
        else if(/^m-\d{4}-\d{2}$/.test(d.id)){
          const days = cleanMonth(d.data()).days;
          await setDoc(doc(fdb, ...B, 'users', u.id, 'data', d.id), {days});
          // נקודת פתיחה ביומן: כל יום קיים נרשם כ"יובא מהגרסה הקודמת" (פעם אחת בלבד, גם אם מריצים שוב)
          for(const dk of Object.keys(days)){
            const aref = doc(fdb, ...B, 'users', u.id, 'audit', 'import-' + dk);
            if(!(await getDoc(aref)).exists()) await setDoc(aref, {at: serverTimestamp(), by: 'import', dk, action: 'import', before: null, after: days[dk]});
          }
        }
      }
      for(const f of (await getDocs(collection(fdb, 'users', u.id, 'files'))).docs){
        const x = f.data();
        if(/^\d{4}-\d{2}-\d{2}$/.test(f.id) && typeof x.data === 'string') await setDoc(doc(fdb, ...B, 'users', u.id, 'files', f.id), {name: str(x.name, 120), type: x.type === 'application/pdf' ? 'application/pdf' : 'image/jpeg', data: x.data, size: x.data.length, at: str(x.at, 10)});
      }
    }
    progress && progress('⏳ עץ ארגוני והגדרות…');
    for(const o of (await getDocs(collection(fdb, 'org'))).docs){
      const x = o.data();
      await setDoc(doc(fdb, ...B, 'org', o.id), {manager: str(x.manager, 128), ancestors: Array.isArray(x.ancestors) ? x.ancestors.filter(a => typeof a === 'string').slice(0, 20) : [], blocked: x.blocked === true, name: str(x.name, 80)});
    }
    const cs = await getDoc(doc(fdb, 'config', 'netsuite'));
    if(cs.exists()) await setDoc(doc(fdb, ...B, 'config', 'netsuite'), JSON.parse(JSON.stringify(cs.data())));
    return us.size;
  } finally {
    await updateDoc(doc(fdb, 'businesses', target), {migration: false}).catch(() => {});
  }
}
